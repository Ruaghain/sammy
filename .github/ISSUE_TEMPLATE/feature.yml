name: Feature
description: A user-facing behaviour, delivered one scenario at a time as sub-issues.
title: "[Feature]: "
labels: ["feature"]
body:
  - type: textarea
    id: story
    attributes:
      label: What and why
      description: The behaviour, in the language of the household - not of the code.
      placeholder: As a <member of the household>, I want <...> so that <...>.
    validations:
      required: true
  - type: input
    id: feature-file
    attributes:
      label: Feature file
      placeholder: tests/acceptance/features/<name>.feature
  - type: textarea
    id: scenarios
    attributes:
      label: Scenarios
      description: Outline the scenarios. Each one becomes a Scenario sub-issue with one PR.
      placeholder: |
        - [ ] ...
