[project]
name = "orchestrator-agent"
version = "0.1.0"
description = "Sammy's orchestrator: the single agent people talk to, which passes each request on."
readme = "README.md"
authors = [
    { name = "Ruaghain", email = "ruaghain_dev@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accounts",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
accounts = { workspace = true }

[tool.uv.build-backend]
# Part of the one `sammy` namespace: no sammy/__init__.py anywhere.
module-name = "sammy.agents.orchestrator"
