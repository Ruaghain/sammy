[project]
name = "cli"
version = "0.1.0"
description = "The sammy command."
readme = "README.md"
authors = [
    { name = "Ruaghain", email = "ruaghain_dev@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bootstrap",
]

[project.scripts]
sammy = "cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
bootstrap = { workspace = true }
