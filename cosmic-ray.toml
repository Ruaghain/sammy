[cosmic-ray]
# Every listed path must exist.
module-path = ["agent", "libs"]
excluded-modules = [
    "agent/*/tests/*",  # unit tests are not code under test
    "libs/*/tests/*",
    # Table definitions only describe the schema for building queries; the
    # migrations create it, and a unit test pins the two together. Mutating
    # these changes nothing at runtime.
    "libs/*/src/sammy/*/tables.py",
    # Migrations: scenarios only ever migrate an empty database to head, so
    # they never upgrade data, downgrade, or see older tables, and nearly
    # every mutant would survive. The migration unit tests cover them
    # (libs/*/tests/test_migrations.py, test_users.py).
    "libs/*/src/sammy/*/migrations/**",
    # Reading settings and setting up the log file: no scenario can see
    # either, so every mutant would survive. Unit tests cover them. (How
    # Sammy starts, sammy/bootstrap/startup.py, is mutated: the acceptance driver
    # starts Sammy through it.)
    "libs/bootstrap/src/sammy/bootstrap/config.py",
    "libs/bootstrap/src/sammy/bootstrap/logs.py",
    # Enforcing foreign keys, and pausing them for migrations: scenarios see
    # only the mistakes foreign keys catch, never the setting itself, so every
    # mutant would survive. libs/core/tests covers it.
    "libs/core/src/sammy/core/database.py",
]
timeout = 30.0
test-command = "pytest -x -q tests/acceptance"  # survivors must point at scenario gaps, so unit tests do not count

[cosmic-ray.distributor]
name = "local"

[cosmic-ray.git-filter]
branch = "master"

# Applied by cr-filter-operators. Mutating `|` into another operator survives
# on every `X | None` type hint, because Python 3.14 never evaluates
# annotations at runtime. The code rarely uses `|` for anything else.
[cosmic-ray.filters.operators-filter]
exclude-operators = ["core/ReplaceBinaryOperator_BitOr_.*"]
