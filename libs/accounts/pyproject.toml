[project]
name = "accounts"
version = "0.1.0"
description = "Sammy's users and login."
readme = "README.md"
authors = [
    { name = "Ruaghain", email = "ruaghain_dev@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "core",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "psycopg[binary]>=3.3.8",
    "sqlalchemy>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
core = { workspace = true }

[tool.uv.build-backend]
# Part of the one `sammy` namespace: no sammy/__init__.py anywhere.
module-name = "sammy.accounts"
