[project]
name = "bootstrap"
version = "0.1.0"
description = "Starting Sammy: settings, logging and wiring, shared by every entry point."
readme = "README.md"
authors = [
    { name = "Ruaghain", email = "ruaghain_dev@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "core",
    "accounts",
    "orchestrator-agent",
    "registry",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
core = { workspace = true }
accounts = { workspace = true }
orchestrator-agent = { workspace = true }
registry = { workspace = true }

[tool.uv.build-backend]
# Part of the one `sammy` namespace: no sammy/__init__.py anywhere.
module-name = "sammy.bootstrap"
