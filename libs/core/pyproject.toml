[project]
name = "core"
version = "0.1.0"
description = "What every Sammy package shares: creating the database engine and the audit log."
authors = [
    { name = "Ruaghain", email = "ruaghain_dev@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Part of the one `sammy` namespace: no sammy/__init__.py anywhere.
module-name = "sammy.core"
