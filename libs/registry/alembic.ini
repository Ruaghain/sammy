# For running Alembic by hand, e.g. to add a migration:
#   SAMMY_DATABASE_URL=sqlite:///scratch.sqlite \
#     uv run alembic -c libs/registry/alembic.ini revision -m "Describe the change"
# Sammy applies migrations itself when it starts, so this isn't needed to run it.
[alembic]
script_location = %(here)s/src/sammy/registry/migrations
file_template = %%(rev)s_%%(slug)s
